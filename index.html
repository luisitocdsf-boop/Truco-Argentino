<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="description" content="Truco Argentino: elegí el modo de juego, creá una sala o buscá una partida.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>Truco Argentino</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <button class="icon-button" id="backButton" aria-label="Volver" hidden>←</button>
      <div class="brand-mark" aria-hidden="true">♠</div>
      <div class="brand-copy">
        <p class="eyebrow">EL JUEGO DE SIEMPRE</p>
        <h1>TRUCO <span>ARGENTINO</span></h1>
      </div>
      <button class="profile-button" id="profileButton" aria-label="Perfil">☺</button>
    </header>

    <section id="playScreen" class="screen">
      <div class="intro">
        <p class="eyebrow gold">MESA PRINCIPAL</p>
        <h2>¿Cómo querés<br><em>jugar?</em></h2>
        <p class="muted">Elegí tu mesa y prepará las cartas.</p>
      </div>

      <div class="mode-grid" aria-label="Modos de juego">
        <button class="mode-card" data-mode="1 vs 1">
          <span class="mode-icon">♟</span><span class="mode-title">1 contra 1</span>
          <span class="mode-subtitle">Duelo individual</span><span class="arrow">↗</span>
        </button>
        <button class="mode-card" data-mode="2 vs 2">
          <span class="mode-icon">♟♟</span><span class="mode-title">2 contra 2</span>
          <span class="mode-subtitle">Por parejas</span><span class="arrow">↗</span>
        </button>
        <button class="mode-card" data-mode="3 vs 3">
          <span class="mode-icon">♟♟♟</span><span class="mode-title">3 contra 3</span>
          <span class="mode-subtitle">Mesa de seis</span><span class="arrow">↗</span>
        </button>
      </div>

      <div class="section-label"><span>JUGÁ CON QUIEN QUIERAS</span><span class="line"></span></div>
      <div class="action-list">
        <button class="action-card" id="createRoom">
          <span class="action-icon">⌑</span>
          <span class="action-copy"><strong>Crear sala privada</strong><small>Invitá amigos con un código</small></span>
          <span class="action-arrow">›</span>
        </button>
        <button class="action-card" id="joinRoom">
          <span class="action-icon">⌕</span>
          <span class="action-copy"><strong>Entrar con un código</strong><small>Unite a la sala de un amigo</small></span>
          <span class="action-arrow">›</span>
        </button>
        <button class="action-card" id="publicMatch">
          <span class="action-icon">◎</span>
          <span class="action-copy"><strong>Buscar partida pública</strong><small>Encontrá otros jugadores</small></span>
          <span class="action-arrow">›</span>
        </button>
      </div>
      <p class="notice"><span class="status-dot"></span> Prototipo local · las partidas online se conectarán después</p>
    </section>

    <section id="detailScreen" class="screen" hidden>
      <button class="back-link" id="backLink">← Volver a Jugar</button>
      <div class="intro compact">
        <p class="eyebrow gold" id="detailEyebrow">CONFIGURACIÓN</p>
        <h2 id="detailTitle">Crear sala</h2>
        <p class="muted" id="detailDescription">Configurá tu mesa.</p>
      </div>
      <div id="detailContent" class="detail-panel"></div>
    </section>

    <nav class="bottom-nav" aria-label="Navegación principal">
      <button class="nav-item active" data-nav="play"><span>♠</span>Jugar</button>
      <button class="nav-item" data-nav="score"><span>╱</span>Anotador</button>
      <button class="nav-item" data-nav="rules"><span>ⓘ</span>Reglas</button>
    </nav>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
